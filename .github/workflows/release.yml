# 自动打包发布：推送 v* 标签时打包插件目录并创建 GitHub Release。
# 结构参照 assistant.koplugin 的 release workflow（omer-faruq/assistant.koplugin）：
#   tag 触发 → 组装 PACKAGE_NAME/ 目录 → 改写 _meta.lua 版本号 → zip → softprops 发布。
# workflow_dispatch 是"干跑"：只跑测试、组装并上传 artifact，不写版本号、不建 Release
# （action-gh-release 必须有 tag，分支上调用会直接失败）。
# 差异：本仓库根目录即插件目录；用 .gitattributes 的 export-ignore 排除
# docs/ tests/ .github（git archive 原生支持，无需额外排除脚本）；
# 打包前先运行 tests/ajbk_test.py 桌面测试作为质量门。

name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_NAME: AJBK.koplugin
      ARCHIVE_NAME: AJBK.koplugin-${{ github.ref_name }}.zip
      IS_TAG: ${{ github.ref_type == 'tag' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # 生成发布说明要读历史与上一个 tag，浅克隆只取一个提交会拿不到
          fetch-depth: 0

      - name: Run desktop unit tests
        run: |
          pip install lupa
          python tests/ajbk_test.py

      - name: Assemble package directory
        run: |
          rm -rf "$PACKAGE_NAME" "$ARCHIVE_NAME"
          # export-ignore（.gitattributes）自动排除 docs/ tests/ .github 等
          git archive --format=tar --prefix="$PACKAGE_NAME/" "${{ github.sha }}" | tar xf -
          if [ "${IS_TAG}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Setting version to $VERSION in $PACKAGE_NAME/_meta.lua"
            sed -i -E "s/(version[[:space:]]*=[[:space:]]*)[^,]+/\1\"${VERSION}\"/" "$PACKAGE_NAME/_meta.lua"
          else
            echo "非 tag 触发：干跑，保留 _meta.lua 里的版本号"
          fi
          cat "$PACKAGE_NAME/_meta.lua"

      - name: Create zip archive
        run: |
          zip -r "$ARCHIVE_NAME" "$PACKAGE_NAME"
          unzip -l "$ARCHIVE_NAME"

      - name: Upload artifact (dry run)
        if: ${{ env.IS_TAG != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

      - name: Write release notes
        if: ${{ env.IS_TAG == 'true' }}
        run: |
          # 发布说明直接写正文，不用 generate_release_notes：本仓库不走 PR 流程，
          # 自动生成的内容只有一行 Full Changelog 链接，等于没说明。
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            echo "变更范围：$PREV..$GITHUB_REF_NAME"
            CHANGES="$(git log --no-merges --pretty=format:'- %s' "$PREV..$GITHUB_REF_NAME")"
          else
            echo "没有上一个 tag，列出到仓库起点"
            CHANGES="$(git log --no-merges --pretty=format:'- %s' "$GITHUB_REF_NAME")"
          fi
          [ -n "$CHANGES" ] || CHANGES="- 详见提交历史"
          {
            echo "## 安装"
            echo
            echo "1. 下载 \`${ARCHIVE_NAME}\` 并解压"
            echo "2. 把整个 \`${PACKAGE_NAME}\` 目录放进 \`koreader/plugins/\`"
            echo "3. 重启 KOReader"
            echo
            echo "配置在 \`koreader/settings/ajbk_config.lua\`，升级不会覆盖它。"
            echo
            echo "## 本次改动"
            echo
            printf '%s\n' "$CHANGES"
          } > release-notes.md
          cat release-notes.md

      - name: Create Release and Upload Asset
        if: ${{ env.IS_TAG == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          make_latest: true
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: ${{ env.ARCHIVE_NAME }}
